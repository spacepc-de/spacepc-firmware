name: Compile Desk Buddy Sleep AI

on:
  push:
    paths:
      - "projects/desk-buddy-sleep-ai/**"
      - "projects/spacepc-airstation/components/esp32_p4_wifi6_touch_lcd_4_3/**"
      - ".github/workflows/desk-buddy-sleep-ai-ci.yml"
  pull_request:
    paths:
      - "projects/desk-buddy-sleep-ai/**"
      - "projects/spacepc-airstation/components/esp32_p4_wifi6_touch_lcd_4_3/**"
      - ".github/workflows/desk-buddy-sleep-ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32p4
          path: projects/desk-buddy-sleep-ai
          command: idf.py build
