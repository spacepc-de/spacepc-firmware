name: Publish firmware release

on:
  push:
    tags:
      - "dummy-test-v*"
      - "ds18b20-mqtt-v*"
      - "spacepc-homeassistant-display-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve release
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          project="${tag%-v*}"
          version="${tag#"$project-v"}"
          if [[ "$project" != "dummy-test" && "$project" != "ds18b20-mqtt" && "$project" != "spacepc-homeassistant-display" ]]; then
            echo "Unsupported project: $project"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install PlatformIO
        run: pip install -r requirements.txt
      - name: Compile
        working-directory: projects/${{ steps.release.outputs.project }}
        run: pio run
      - name: Prepare manifest and checksums
        shell: bash
        run: |
          args=(
            --project "${{ steps.release.outputs.project }}"
            --version "${{ steps.release.outputs.version }}"
            --out firmware-dist
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --source-commit "$GITHUB_SHA"
          )
          if [[ "${{ steps.release.outputs.project }}" == "dummy-test" ]]; then
            args+=(
              --target "ESP32:esp32:projects/${{ steps.release.outputs.project }}/.pio/build/esp32-devkit"
              --target "ESP32-S3:esp32-s3:projects/${{ steps.release.outputs.project }}/.pio/build/esp32-s3-devkit"
              --hardware "ESP32 DevKit development target (unverified)"
              --hardware "ESP32-S3 DevKitC-1 development target (unverified)"
              --release-note "Automated dummy firmware pipeline test. No device functionality is included."
            )
          elif [[ "${{ steps.release.outputs.project }}" == "ds18b20-mqtt" ]]; then
            args+=(
              --target "ESP32:esp32:projects/${{ steps.release.outputs.project }}/.pio/build/esp32-devkit"
              --target "ESP32-S3:esp32-s3:projects/${{ steps.release.outputs.project }}/.pio/build/esp32-s3-devkit"
              --target "ESP32-S2:esp32-s2:projects/${{ steps.release.outputs.project }}/.pio/build/esp32-s2-devkit"
              --target "ESP32-C3:esp32-c3:projects/${{ steps.release.outputs.project }}/.pio/build/esp32-c3-devkit"
              --hardware "Generic ESP32 DevKit build target"
              --hardware "ESP32-S2 Saola-1 build target"
              --hardware "ESP32-S3 DevKitC-1 build target"
              --hardware "ESP32-C3 DevKitM-1 build target"
              --release-note "DS18B20 temperature sensor with local web setup, MQTT and optional Home Assistant Discovery."
            )
          else
            args+=(
              --target "ESP32:esp32:projects/${{ steps.release.outputs.project }}/.pio/build/gooddisplay-esp32-l"
              --hardware "Good Display ESP32-L with DESPI-C02 and GDEY075Z08"
              --release-note "Home Assistant-managed 7.5-inch e-paper display with value, status and graph widgets."
            )
          fi
          node scripts/prepare-release.mjs "${args[@]}"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" firmware-dist/* --verify-tag --generate-notes
      - name: Publish browser installer files to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          versioned="s3://${S3_BUCKET}/firmware/${{ steps.release.outputs.project }}/${{ steps.release.outputs.version }}"
          latest="s3://${S3_BUCKET}/firmware/${{ steps.release.outputs.project }}/latest"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp firmware-dist "$versioned" \
            --recursive \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp firmware-dist "$latest" \
            --recursive \
            --cache-control "public,max-age=60"
