name: Publish firmware release

on:
  push:
    tags:
      - "dummy-test-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve release
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          project="${tag%-v*}"
          version="${tag#"$project-v"}"
          if [[ "$project" != "dummy-test" ]]; then
            echo "Unsupported project: $project"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install PlatformIO
        run: pip install -r requirements.txt
      - name: Compile
        working-directory: projects/${{ steps.release.outputs.project }}
        run: pio run
      - name: Prepare manifest and checksums
        run: |
          node scripts/prepare-release.mjs \
            --project "${{ steps.release.outputs.project }}" \
            --version "${{ steps.release.outputs.version }}" \
            --esp32-build-dir "projects/${{ steps.release.outputs.project }}/.pio/build/esp32-devkit" \
            --esp32-s3-build-dir "projects/${{ steps.release.outputs.project }}/.pio/build/esp32-s3-devkit" \
            --out firmware-dist \
            --hardware "ESP32 DevKit and ESP32-S3 DevKit development targets (unverified)" \
            --stability beta \
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-commit "$GITHUB_SHA"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" firmware-dist/* --verify-tag --generate-notes
      - name: Publish browser installer files to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          versioned="s3://${S3_BUCKET}/firmware/${{ steps.release.outputs.project }}/${{ steps.release.outputs.version }}"
          latest="s3://${S3_BUCKET}/firmware/${{ steps.release.outputs.project }}/latest"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp firmware-dist "$versioned" \
            --recursive \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp firmware-dist "$latest" \
            --recursive \
            --cache-control "public,max-age=60"
