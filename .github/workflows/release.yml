name: Publish firmware release

on:
  push:
    tags:
      - "dummy-test-v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve release
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          project="${tag%-v*}"
          version="${tag#"$project-v"}"
          if [[ "$project" != "dummy-test" ]]; then
            echo "Unsupported project: $project"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install PlatformIO
        run: pip install -r requirements.txt
      - name: Compile
        working-directory: projects/${{ steps.release.outputs.project }}
        run: pio run
      - name: Prepare manifest and checksums
        run: |
          node scripts/prepare-release.mjs \
            --project "${{ steps.release.outputs.project }}" \
            --version "${{ steps.release.outputs.version }}" \
            --build-dir "projects/${{ steps.release.outputs.project }}/.pio/build/spacepc-development" \
            --out firmware-dist \
            --hardware "development-target-unverified" \
            --stability beta \
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-commit "$GITHUB_SHA"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" firmware-dist/* --verify-tag --generate-notes
      - name: Prepare browser installer files
        run: |
          versioned="firmware-site/${{ steps.release.outputs.project }}/${{ steps.release.outputs.version }}"
          latest="firmware-site/${{ steps.release.outputs.project }}/latest"
          mkdir -p "$versioned" "$latest"
          cp firmware-dist/* "$versioned/"
          cp firmware-dist/* "$latest/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: firmware-site
      - name: Publish browser installer files
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          token: ${{ github.token }}
