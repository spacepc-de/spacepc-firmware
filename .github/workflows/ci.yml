name: Compile firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PlatformIO
        run: pip install -r requirements.txt
      - name: Compile dummy test
        working-directory: projects/dummy-test
        run: pio run
      - name: Compile DS18B20 MQTT sensor
        working-directory: projects/ds18b20-mqtt
        run: pio run
      - name: Compile Home Assistant display
        working-directory: projects/spacepc-homeassistant-display
        run: pio run
