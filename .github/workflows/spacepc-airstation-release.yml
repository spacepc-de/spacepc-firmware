name: Publish SpacePC Airstation release

on:
  push:
    tags:
      - "spacepc-airstation-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#spacepc-airstation-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ESP32-P4 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32p4
          path: projects/spacepc-airstation
          command: idf.py build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare browser installer manifest
        run: |
          node scripts/prepare-release.mjs \
            --project spacepc-airstation \
            --version "${{ steps.release.outputs.version }}" \
            --target "ESP32-P4:esp32-p4:projects/spacepc-airstation/build" \
            --out firmware-dist \
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-commit "$GITHUB_SHA" \
            --hardware "Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3 with Sensirion SEN66" \
            --release-note "Touch-enabled SEN66 air-quality station with local Home Assistant discovery."
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=("$GITHUB_REF_NAME" firmware-dist/* --verify-tag --generate-notes)
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
      - name: Publish browser installer files to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          versioned="s3://${S3_BUCKET}/firmware/spacepc-airstation/${{ steps.release.outputs.version }}"
          latest="s3://${S3_BUCKET}/firmware/spacepc-airstation/latest"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp firmware-dist "$versioned" \
            --recursive --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp firmware-dist "$latest" \
            --recursive --cache-control "public,max-age=60"
