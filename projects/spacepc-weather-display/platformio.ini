[platformio]
default_envs = esp32-l

[env:esp32-l]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
extra_scripts = post:../../scripts/export-flash-layout.py
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  zinggjm/GxEPD2@1.6.9
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.2
  adafruit/Adafruit GFX Library@1.12.1
