[platformio]
default_envs = gooddisplay-esp32-l

[env:gooddisplay-esp32-l]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../../lib
extra_scripts = post:../../scripts/export-flash-layout.py
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  zinggjm/GxEPD2@1.6.9
  bblanchon/ArduinoJson@7.4.2
  knolleary/PubSubClient@2.8
