[platformio]
default_envs =
  esp32-devkit
  esp32-s2-devkit
  esp32-s3-devkit
  esp32-c3-devkit

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
extra_scripts = post:../../scripts/export-flash-layout.py
monitor_speed = 115200
lib_deps =
  milesburton/DallasTemperature@4.0.5
  knolleary/PubSubClient@2.8
build_flags =
  -D MQTT_MAX_PACKET_SIZE=1024

[env:esp32-devkit]
board = esp32dev

[env:esp32-s2-devkit]
board = esp32-s2-saola-1

[env:esp32-s3-devkit]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkit]
board = esp32-c3-devkitm-1
