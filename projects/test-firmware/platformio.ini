[platformio]
default_envs =
  esp32-devkit
  esp32-s2-devkit
  esp32-s3-devkit
  esp32-c3-devkit

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
extra_scripts = post:../../scripts/export-flash-layout.py
monitor_speed = 115200

[env:esp32-devkit]
board = esp32dev

[env:esp32-s2-devkit]
board = esp32-s2-saola-1

[env:esp32-s3-devkit]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkit]
board = esp32-c3-devkitm-1
